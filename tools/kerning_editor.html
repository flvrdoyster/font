<link rel="stylesheet" href="editor.css">
<style>
  /* Page-specific -- see editor.css's own comment on the split. Table/pill
     styles mirror pixel_editor.html's 부품 셀/결함 tabs (same table shape,
     same "얼마나 남았나" reading), but this page has no shared canvas to
     hang off of -- kerning is a PAIR value, not a single glyph's pixels --
     so it stands alone rather than becoming a third palette tab. */
  .seg { display: inline-flex; border: 1px solid var(--grid-line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted);
                font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--grid-line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .summary { font-size: 12px; color: var(--muted); }

  table.kt { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.kt th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px;
                padding: 4px 8px; border-bottom: 1px solid var(--grid-line); position: sticky; top: 0;
                background: var(--panel); }
  table.kt td { padding: 4px 8px; border-top: 1px solid var(--faint); vertical-align: middle; }
  table.kt tr.row { cursor: pointer; }
  table.kt tr.row:hover td { background: var(--cell-off); }
  table.kt tr.row[aria-selected="true"] td { background: var(--accent-soft); }
  .kt-scroll { max-height: 60vh; overflow: auto; border: 1px solid var(--faint); border-radius: 8px; }

  .pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 99px;
          border: 1px solid var(--grid-line); color: var(--muted); }
  .pill.override { border-color: var(--accent); color: var(--accent); }

  canvas.pairprev { image-rendering: pixelated; display: block; background: var(--cell-off);
                    border: 1px solid var(--faint); border-radius: 4px; }

  .detail-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .detail-row input[type="text"] { width: 4em; font: inherit; }
  .detail-row input[type="number"] { width: 5em; font: inherit; padding: 4px 6px;
                                      border: 1px solid var(--grid-line); border-radius: 6px; }
  .stepper { display: inline-flex; gap: 4px; align-items: center; }
</style>

<div class="app">
  <header class="topbar">
    <h1>커닝 검수</h1>
    <div class="seg" role="tablist" aria-label="웨이트">
      <button type="button" data-weight="light" aria-pressed="true">Regular</button>
      <button type="button" data-weight="regular" aria-pressed="false">Bold</button>
    </div>
    <span class="status" id="status">불러오는 중…</span>
  </header>

  <div class="card">
    <p class="summary" id="summary"></p>
    <div class="detail-row" style="margin-top: 8px;">
      <label>쌍 직접 보기 <input type="text" id="lookup" maxlength="2" placeholder="AT"></label>
      <span class="summary">클래스 대표만 목록에 뜸 — 같은 클래스의 다른 글자를 보려면 여기 입력</span>
    </div>
  </div>

  <div class="card" id="detailCard" hidden>
    <div class="detail-row">
      <canvas class="pairprev" id="pairPrev"></canvas>
      <div>
        <div id="pairLabel" style="font-size: 20px; font-weight: 600;"></div>
        <div class="summary">계산값 <span id="computedVal"></span>px</div>
      </div>
      <div class="stepper">
        <button class="btn" id="stepDown">−1px</button>
        <input type="number" id="valueInput" step="1">
        <button class="btn" id="stepUp">+1px</button>
        <button class="btn primary" id="saveOverride">저장</button>
        <button class="btn" id="resetOverride">계산값으로 되돌리기</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top: 16px;">
    <div class="kt-scroll">
      <table class="kt">
        <thead><tr><th>미리보기</th><th>쌍</th><th>값</th><th>클래스 크기</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
  const statusEl = document.getElementById("status");
  const toastsEl = document.getElementById("toasts");
  const summaryEl = document.getElementById("summary");
  const rowsEl = document.getElementById("rows");
  const weightSeg = document.querySelector(".seg");
  const lookupEl = document.getElementById("lookup");

  let WEIGHT = "light";
  let selected = null;   // {x, y}
  const SCALE = 6;

  function showToast(message, kind) {
    const el = document.createElement("div");
    el.className = "toast";
    el.dataset.kind = kind || "info";
    el.innerHTML = `<span class="dot"></span><span></span>`;
    el.lastElementChild.textContent = message;
    toastsEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    const life = kind === "error" ? 4200 : 2400;
    setTimeout(() => {
      el.classList.remove("show");
      el.addEventListener("transitionend", () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 300);
    }, life);
  }

  function drawPair(canvas, rowsX, rowsY, kernPx) {
    const wx = rowsX[0].length, wy = rowsY[0].length;
    const gapPx = 2 + kernPx;   // 2 = the two 1px side bearings already baked into each glyph
    const totalW = wx + Math.max(gapPx, 0) + wy;
    canvas.width = totalW; canvas.height = 16;
    canvas.style.width = (totalW * SCALE) + "px";
    canvas.style.height = (16 * SCALE) + "px";
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, totalW, 16);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink");
    const paint = (rows, x0) => {
      for (let y = 0; y < 16; y++)
        for (let x = 0; x < rows[0].length; x++)
          if (rows[y][x] === "#") ctx.fillRect(x0 + x, y, 1, 1);
    };
    paint(rowsX, 0);
    paint(rowsY, wx + Math.max(gapPx, 0));
  }

  async function loadWorklist() {
    statusEl.textContent = "불러오는 중…";
    try {
      const res = await fetch("api/kerning?weight=" + WEIGHT + "&n=300", { cache: "no-store" });
      const j = await res.json();
      summaryEl.textContent =
        `커닝 대상 ${j.summary.kernable_chars}자 · 0이 아닌 클래스쌍 ${j.summary.class_pairs}개 ` +
        `· 상위 ${j.pairs.length}개 표시 (|조정값| 큰 순)`;
      renderRows(j.pairs);
      statusEl.textContent = "준비됨";
      statusEl.dataset.on = "true";
    } catch (e) {
      statusEl.textContent = "불러오기 실패";
      showToast(String(e.message || e), "error");
    }
  }

  function renderRows(pairs) {
    rowsEl.innerHTML = "";
    for (const p of pairs) {
      const tr = document.createElement("tr");
      tr.className = "row";
      const cv = document.createElement("canvas");
      cv.className = "pairprev";
      const td0 = document.createElement("td");
      td0.appendChild(cv);
      tr.appendChild(td0);
      const td1 = document.createElement("td");
      td1.innerHTML = `<span style="font-size:16px">${p.x}${p.y}</span>`;
      tr.appendChild(td1);
      const td2 = document.createElement("td");
      td2.innerHTML = `${p.effective}px` +
        (p.override !== null ? ` <span class="pill override">override</span>` : "");
      tr.appendChild(td2);
      const td3 = document.createElement("td");
      td3.textContent = p.class_size;
      tr.appendChild(td3);
      tr.addEventListener("click", () => selectPair(p.x, p.y));
      rowsEl.appendChild(tr);
      // preview draws once we know both glyphs' rows -- reuse the detail
      // fetch rather than duplicating the row-string math client-side.
      fetch("api/kerning_pair?weight=" + WEIGHT + "&s=" + encodeURIComponent(p.x + p.y))
        .then(r => r.json())
        .then(info => { if (!info.error) drawPair(cv, info.rows_x, info.rows_y, info.effective); });
    }
  }

  async function selectPair(x, y) {
    selected = { x, y };
    document.querySelectorAll("table.kt tr.row").forEach(tr =>
      tr.setAttribute("aria-selected", tr.textContent.startsWith(x + y) ? "true" : "false"));
    const res = await fetch("api/kerning_pair?weight=" + WEIGHT + "&s=" + encodeURIComponent(x + y));
    const info = await res.json();
    if (info.error) { showToast(info.error, "error"); return; }
    document.getElementById("detailCard").hidden = false;
    document.getElementById("pairLabel").textContent = `${x}${y}`;
    document.getElementById("computedVal").textContent = info.computed;
    document.getElementById("valueInput").value = info.effective;
    drawPair(document.getElementById("pairPrev"), info.rows_x, info.rows_y, info.effective);
  }

  lookupEl.addEventListener("input", () => {
    const chars = Array.from(lookupEl.value);
    if (chars.length === 2) selectPair(chars[0], chars[1]);
  });

  function nudge(delta) {
    const el = document.getElementById("valueInput");
    el.value = (parseInt(el.value, 10) || 0) + delta;
  }
  document.getElementById("stepDown").addEventListener("click", () => nudge(-1));
  document.getElementById("stepUp").addEventListener("click", () => nudge(1));

  async function saveOverride(value) {
    if (!selected) return;
    try {
      const res = await fetch("api/kerning_override", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ weight: WEIGHT, x: selected.x, y: selected.y, value }),
      });
      const info = await res.json();
      if (info.error) throw new Error(info.error);
      showToast(value === null ? "계산값으로 되돌림" : `저장됨 (${value}px)`, "success");
      document.getElementById("computedVal").textContent = info.computed;
      document.getElementById("valueInput").value = info.effective;
      drawPair(document.getElementById("pairPrev"), info.rows_x, info.rows_y, info.effective);
      loadWorklist();   // this pair's row (or its class rep) may need to move/update
    } catch (e) {
      showToast(String(e.message || e), "error");
    }
  }
  document.getElementById("saveOverride").addEventListener("click", () =>
    saveOverride(parseInt(document.getElementById("valueInput").value, 10) || 0));
  document.getElementById("resetOverride").addEventListener("click", () => saveOverride(null));

  weightSeg.addEventListener("click", e => {
    const btn = e.target.closest("button[data-weight]");
    if (!btn) return;
    WEIGHT = btn.dataset.weight;
    for (const b of weightSeg.querySelectorAll("button"))
      b.setAttribute("aria-pressed", b === btn);
    document.getElementById("detailCard").hidden = true;
    selected = null;
    loadWorklist();
  });

  loadWorklist();
</script>
