<title>도깨비DNR 픽셀 에디터</title>
<link rel="stylesheet" href="editor.css">
<style>
  /* Page-specific only -- shared colour tokens, .app/.topbar/.card/.btn/
     .status/.toast live in editor.css (see that file's header comment). */
  :root {
    --guide: #2f78ab; --guide2: #9333c9; --guide3: #2f8c4e;
  }

  .wtab { font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px;
    border: 0; background: var(--panel); color: var(--muted); cursor: pointer; }
  .wtab-note { font-weight: 400; font-size: 11px; opacity: 0.75; margin-left: 4px; }
  .wtab[aria-selected="true"] { background: var(--accent); color: #fff; }

  .ptab-bar { display: flex; gap: 6px; margin-bottom: 12px; }
  .ptab { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--grid-line); background: var(--panel);
    color: var(--muted); cursor: pointer; }
  .ptab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft);
    color: var(--ink); }

  .tier { max-width: var(--page-max); margin: 16px auto 0; }
  .tier:first-of-type { margin-top: 0; }

  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; margin: 0 0 8px; }

  /* editing stage */
  .stage-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 14px; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field span { font-size: 12px; color: var(--muted); }
  input[type="text"] { font-family: var(--mono); font-size: 14px; width: 3.2em;
    text-align: center; padding: 5px 6px; border: 1px solid var(--grid-line);
    border-radius: 7px; background: var(--ground); color: var(--ink); }
  .cp { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .seg { display: inline-flex; border: 1px solid var(--grid-line);
    border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted);
    font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* Canvas column is sized to the canvas (16 cells x 22px + 2px border each
     side), not to half the card -- the old 1fr 1fr left ~180px of dead space
     beside a fixed-size grid while the controls beside it wrapped. */
  .draw-split { display: grid; grid-template-columns: 356px minmax(0, 1fr);
    gap: 24px; align-items: start; margin-top: 12px; }
  @media (max-width: 760px) { .draw-split { grid-template-columns: 1fr; }
    .gridwrap { justify-content: flex-start; } }

  .gridwrap { display: flex; justify-content: center; }
  .grid-outer { position: relative; }
  .grid { display: grid; gap: 0; background: var(--grid-line);
    border: 2px solid var(--grid-line); touch-action: none; }
  .cell { width: 22px; height: 22px; background: var(--cell-off); border: 0;
    padding: 0; cursor: crosshair; outline: none; }
  .cell:nth-child(odd) { background: var(--cell-off); }
  .cell.on { background: var(--ink); }
  .cell:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
  .grid.showgrid .cell { border-right: 1px solid var(--grid-line);
    border-bottom: 1px solid var(--grid-line); }

  .ghost { position: absolute; inset: 2px; pointer-events: none; opacity: 0.35; }
  .ghost-sym { position: absolute; inset: 2px; pointer-events: none; opacity: 0.45; }
  .ghost-ref2 { position: absolute; inset: 2px; pointer-events: none; opacity: 0.45; }

  .guides { position: absolute; inset: 2px; pointer-events: none; }
  .guides .gline { position: absolute; left: 0; right: 0; height: 0;
    border-top: 1px dashed var(--guide); opacity: 0.75; }
  .guides .gline b { position: absolute; right: 100%; margin-right: 6px; top: -8px;
    font-size: 9px; color: var(--guide); white-space: nowrap; font-family: var(--mono); }
  .guides .vline { position: absolute; top: 0; bottom: 0; width: 0;
    border-left: 1px dashed var(--guide); opacity: 0.55; }

  /* Left-aligned, not centred: these read as a column of controls next to the
     canvas, and centring made the row jump around as labels changed width. */
  .row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools .btn[data-act$="ft"], .tools .btn[data-act$="ght"],
  .tools .btn[data-act="up"], .tools .btn[data-act="down"] { min-width: 34px; }
  .tool-gap { width: 10px; }

  /* Controls and the 1x/2x/3x proof sit side by side so the column beside a
     fixed-size canvas isn't mostly empty; stacks under it when narrow. */
  .draw-side { display: grid; grid-template-columns: minmax(230px, max-content) auto;
    gap: 28px; align-items: start; }
  @media (max-width: 1000px) { .draw-side { grid-template-columns: 1fr; gap: 16px; } }
  .side-controls { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

  .preview { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .preview canvas { image-rendering: pixelated; background: var(--cell-off);
    border: 1px solid var(--faint); border-radius: 4px; }
  .pv { display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .pv span { font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; }

  /* palette */
  .palette { display: grid; grid-template-columns: repeat(auto-fill, calc(var(--sw-cv) + 6px)); gap: 5px; }
  .palette-scroll { max-height: 320px; overflow-y: auto; border: 1px solid var(--faint);
    border-radius: 8px; padding: 8px; }
  /* --sw-cv is the glyph's on-screen height in CSS px -- 1x/2x/3x means
     literal 1/2/3 CSS px per glyph px, same convention as the #pv1/2/3
     drawing-canvas previews. Swatch box just adds a fixed margin around it. */
  :root { --sw-cv: 32px; }
  .swatch { position: relative; width: calc(var(--sw-cv) + 6px); height: calc(var(--sw-cv) + 6px);
    border: 1px solid var(--faint); border-radius: 6px; background: var(--cell-off);
    cursor: pointer; padding: 0; display: grid; place-items: center; overflow: hidden; }
  .swatch:hover { border-color: var(--accent); }
  .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .swatch.saved { border-color: var(--confirm); }
  .swatch.empty { border-style: dashed; opacity: 0.55; }
  .swatch.saved::after { content: ""; position: absolute; top: 2px; right: 2px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--confirm); }
  /* height forces the scale (canvas.height is always 16, the glyph's fixed
     row count); width: auto derives from that via the canvas's own intrinsic
     aspect ratio, so 8px-wide halfwidth glyphs stay half as wide, not
     stretched to a square. max-*, by contrast, only caps -- it never grows a
     canvas past its native resolution, which is why this looked unchanged. */
  .swatch canvas { image-rendering: pixelated; height: var(--sw-cv); width: auto; }

  .palette-group + .palette-group { margin-top: 16px; }
  .sublabel { font-size: 11px; color: var(--muted); margin: 0 0 8px; letter-spacing: 0.03em; }

  /* 부품 셀 탭 */
  .cellbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ctoggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .ctoggle input { accent-color: var(--accent); }
  .cell-split { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .cell-list { flex: 1 1 460px; min-width: 340px; max-height: 320px; overflow-y: auto;
    border: 1px solid var(--faint); border-radius: 8px; }
  .cell-affected { flex: 1 1 300px; min-width: 260px; }
  p.cell-affected { color: var(--muted); align-self: center; }
  .cell-affected[hidden] { display: none; }
  .celltable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .celltable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px;
    padding: 5px 8px; position: sticky; top: 0; background: var(--panel); }
  .celltable td { padding: 4px 8px; border-top: 1px solid var(--faint); }
  .celltable tr.row { cursor: pointer; }
  .celltable tr.row:hover td { background: var(--cell-off); }
  .celltable tr.row[aria-selected="true"] td { background: var(--accent-soft); }
  .celltable .jamo { font-size: 15px; font-weight: 600; }
  .pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 99px;
    border: 1px solid var(--grid-line); color: var(--muted); }
  .pill.empty { border-color: var(--warn); color: var(--warn); }
  .pill.warn { border-color: var(--accent); color: var(--accent); }

</style>

<div class="app">
  <!-- One toolbar row: identity, what you're editing, and the two build
       actions. data-weight keys ("regular"=2px, "light"=1px) describe stroke
       width and are unchanged; the labels show what each compiles to in the
       single RIBBI family: 1px stems -> Regular (default), 2px stems -> Bold. -->
  <header class="topbar">
    <h1>도깨비DNR</h1>
    <div class="seg" role="tablist" aria-label="웨이트">
      <button class="wtab" data-weight="light" role="tab" aria-selected="true"
        title="1px 줄기 — 컴파일하면 Regular 멤버">Regular <span class="wtab-note">1px</span></button>
      <button class="wtab" data-weight="regular" role="tab" aria-selected="false"
        title="2px 줄기 — 컴파일하면 Bold 멤버">Bold <span class="wtab-note">2px</span></button>
    </div>
    <span class="status" id="status" data-on="false">오프라인 · 저장 불가</span>
    <span style="flex:1"></span>
    <button class="btn" id="buildBmp" hidden
      title="PC-98용 테스트 font.bmp를 다시 만듭니다 — 완성형 Light(compose_light.py)와 반각 한글(glyphs_halfwidth.json)을 최신 저장 내용으로 반영합니다. build/font_light.bmp에 씀. 편집 중인 미저장 글자는 포함되지 않습니다.">BMP</button>
    <button class="btn" id="buildFont" hidden
      title="한 패밀리의 Regular(1px)·Bold(2px) 두 멤버를 순서대로 컴파일합니다(현재 탭과 무관). 편집 중인 미저장 글자는 포함되지 않습니다. 빌드 로그는 브라우저 콘솔에 출력됩니다.">빌드</button>
  </header>

  <!-- 1. 글자 그리기 -->
  <section class="card tier">
    <div class="stage-head">
      <label class="field"><span>글자</span>
        <input type="text" id="charInput" maxlength="2" value="A" autocomplete="off"></label>
      <span class="cp" id="cpLabel">U+0041</span>
      <span class="cp" id="widthLabel">8px</span>
      <span style="flex:1"></span>
      <label class="field"><span>참고</span>
        <input type="text" id="refCharInput" maxlength="2" value="" autocomplete="off"></label>
      <div class="seg" role="group" aria-label="보조선">
        <button id="guideBtn" aria-pressed="true">안내선</button>
        <button id="ghostBtn" aria-pressed="true">오버레이</button>
      </div>
    </div>
    <div class="draw-split">
      <div class="gridwrap">
        <div class="grid-outer">
          <div class="grid showgrid" id="grid"></div>
          <canvas class="ghost" id="ghost"></canvas>
          <canvas class="ghost-sym" id="ghostSym"></canvas>
          <canvas class="ghost-ref2" id="ghostRef2"></canvas>
          <div class="guides" id="guides"></div>
        </div>
      </div>

      <div class="draw-side">
        <div class="side-controls">
          <!-- Save first: it's the action every edit ends in. -->
          <div class="row-actions">
            <button class="btn primary" id="saveOne" hidden>저장</button>
            <button class="btn" data-act="revert">원래대로</button>
            <button class="btn" data-act="clear">비우기</button>
          </div>
          <div class="tools">
            <button class="btn" data-act="left" title="왼쪽으로 1px">←</button>
            <button class="btn" data-act="down" title="아래로 1px">↓</button>
            <button class="btn" data-act="up" title="위로 1px">↑</button>
            <button class="btn" data-act="right" title="오른쪽으로 1px">→</button>
            <span class="tool-gap"></span>
            <button class="btn" data-act="copygrid">복사</button>
            <button class="btn" data-act="pastegrid">붙여넣기</button>
          </div>
        </div>

        <div class="preview">
          <div class="pv"><span>1×</span><canvas id="pv1"></canvas></div>
          <div class="pv"><span>2×</span><canvas id="pv2"></canvas></div>
          <div class="pv"><span>3×</span><canvas id="pv3"></canvas></div>
        </div>
      </div>
    </div>
  </section>


  <!-- 2. 글자 불러오기 (팔레트) -->
  <section class="card tier">
    <div class="stage-head" style="margin-bottom:10px">
      <p class="label" style="margin:0">글자 불러오기</p>
      <span style="flex:1"></span>
      <div class="seg" role="group" aria-label="팔레트 배율">
        <button data-swscale="1" aria-pressed="false">1×</button>
        <button data-swscale="2" aria-pressed="true">2×</button>
        <button data-swscale="3" aria-pressed="false">3×</button>
      </div>
    </div>
    <div class="ptab-bar" role="tablist" aria-label="팔레트 분류">
      <button class="ptab" data-cat="latin" role="tab" aria-selected="true">영숫자</button>
      <button class="ptab" data-cat="hangul" role="tab" aria-selected="false">한글</button>
      <button class="ptab" data-cat="symbols" role="tab" aria-selected="false">기호</button>
      <button class="ptab" data-cat="cells" role="tab" aria-selected="false">부품 셀</button>
    </div>
    <!-- Every category has the same shape: one scroll box, and inside it a
         .palette-group per set (sublabel + swatch grid). Latin used to have
         no box at all and 기호 put the box around the whole set list, so the
         three read as three different components. -->
    <div class="palette-cat" data-cat="latin">
      <div class="palette-scroll">
        <div class="palette-group">
          <p class="sublabel">반각 A–Z · a–z · 0–9</p>
          <div class="palette" id="paletteHalf"></div>
        </div>
        <div class="palette-group">
          <p class="sublabel">전각 Ａ–Ｚ · ａ–ｚ · ０–９</p>
          <div class="palette" id="paletteFull"></div>
        </div>
      </div>
    </div>
    <div class="palette-cat" data-cat="hangul" hidden>
      <div class="palette-scroll">
        <div class="palette-group">
          <p class="sublabel">한글 완성형 (KS X 1001, 2,350자)</p>
          <div class="palette" id="paletteAll2350"></div>
        </div>
      </div>
    </div>
    <div class="palette-cat" data-cat="symbols" hidden>
      <div class="palette-scroll" id="paletteSymbolsWrap"></div>
    </div>
    <!-- 부품 셀: 11,172자 확장용. 셀을 고르면 그 셀의 대표 음절이 위 캔버스로
         올라오고, 저장하면 부품이 자동 추출된다. 자세한 건 docs/ROADMAP.md. -->
    <div class="palette-cat" data-cat="cells" hidden>
      <div class="cellbar">
        <label class="ctoggle"><input type="checkbox" id="cellTodoOnly"> 그릴 셀만</label>
        <span class="cp" id="cellCount"></span>
      </div>
      <div class="cell-split">
        <div class="cell-list">
          <table class="celltable">
            <thead><tr><th>셀</th><th>벌</th><th>상태</th><th>영향</th><th>제안</th></tr></thead>
            <tbody id="cellRows"></tbody>
          </table>
        </div>
        <!-- hidden until a cell is picked: an empty bordered scroll box just
             reserves width for nothing -->
        <div class="palette-scroll cell-affected" id="cellPrevBox" hidden>
          <div class="palette-group">
            <p class="sublabel" id="cellPrevMeta"></p>
            <div class="palette" id="paletteCells"></div>
          </div>
        </div>
        <p class="sublabel cell-affected" id="cellPrevEmpty">셀을 고르세요</p>
      </div>
    </div>
  </section>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";
  let DATA = JSON.parse(document.getElementById("glyphdata").textContent);
  // normalize embedded fallback ({char:{w,rows}}) to {char:{rows}}
  for (const k in DATA) if (DATA[k].rows) DATA[k] = DATA[k];
  let SERVER = false;
  let WEIGHT = "light";   // "regular"=2px(Bold) | "light"=1px(Regular, default) -- selects glyphs_<weight>.json
  const H = 16;
  let W = 8;
  let cells = blank(W);
  let curChar = "A";
  let paletteData = {};   // char -> rows, sourced from the original bitmap as a fallback

  const HALF_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  function toFullwidth(ch) {
    const c = ch.charCodeAt(0);
    if (c >= 65 && c <= 90) return String.fromCodePoint(0xFF21 + (c - 65));   // A-Z
    if (c >= 97 && c <= 122) return String.fromCodePoint(0xFF41 + (c - 97));  // a-z
    if (c >= 48 && c <= 57) return String.fromCodePoint(0xFF10 + (c - 48));   // 0-9
    return ch;
  }
  const FULL_CHARS = Array.from(HALF_CHARS).map(toFullwidth).join("");
  // 자주 쓰는 기호 -- ASCII 반각 문장부호/전각 대응 + scripts/coverage_report.py의
  // 큐레이션 세트(SETS)와 동일한 8개 그룹. 폰트에 이미 있는(원본 벡터화 또는
  // 손그림) 기호를 편집할 수 있게 하는 게 목적이라, 여기 없는 기호를 추가하고
  // 싶으면 coverage_report.py의 SETS도 같이 갱신할 것.
  const ASCII_PUNCT = "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";
  // ASCII printable (U+0021-007E) -> fullwidth form is a flat +0xFEE0 offset
  // (the same rule toFullwidth hand-codes per range for letters/digits only).
  function toFullwidthAny(ch) {
    const c = ch.codePointAt(0);
    return (c >= 0x21 && c <= 0x7E) ? String.fromCodePoint(c + 0xFEE0) : ch;
  }
  // Tier 1 = WGL4 / Adobe Latin 수준의 사실상 표준, Tier 2 = 한국어 폰트 관례,
  // Tier 3 = 도스/터미널 화면용 괘선·블록 (이 폰트는 PC-98 납품이라 사실상 필수).
  const SYMBOL_GROUPS = [
    ["ascii-half", "ASCII 기호 (반각)", ASCII_PUNCT],
    ["ascii-full", "전각 기호", Array.from(ASCII_PUNCT).map(toFullwidthAny).join("")],
    ["latin1", "Latin-1 기호", "¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿×÷"],
    ["dash", "문장부호 · 대시", "–—―…·‥•※†‡‰′″⁄、。〃"],
    ["quote", "따옴표", "“”‘’„‚«»‹›"],
    ["currency", "통화기호", "€₩￦£¥¢¤"],
    ["math", "수학 · 기호", "−±×÷≠≤≥≈∞√∑∏∫∂∇∆◊°µΩ"],
    ["arrow", "화살표", "←↑→↓↔↕⇐⇒⇔↖↗↘↙"],
    ["bracket", "괄호 · 구분", "「」『』【】〈〉《》〔〕｛｝"],
    ["shape", "도형 · 불릿", "■□▲△▼▽●○◆◇★☆♠♥♦♣♪♬"],
    ["box", "괘선", "─│┌┐└┘├┤┬┴┼━┃┏┓┗┛┣┫┳┻╋╱╲╳"],
    ["block", "블록", "░▒▓█▀▄▌▐"],

  // KS X 1001 완성형 2,350자 전체 -- 서버의 /api/ks2350에서 채워짐 (정적 리터럴이 아님).
  let KS2350_CHARS = [];
  async function fetchKs2350() {

      const j = await res.json();

  let ghostOn = true;

  const gridEl = document.getElementById("grid");
  const guidesEl = document.getElementById("guides");
  const charInput = document.getElementById("charInput");
  const cpLabel = document.getElementById("cpLabel");

  function blank(w) {
    return Array.from({ length: H }, () => Array(w).fill(false));
  }
  function rowsToCells(rows) {
    const w = rows[0].length;
    return rows.map(r => Array.from({ length: w }, (_, x) => r[x] === "#"));
  }
  function cellsToRows() {
    return cells.map(row => row.map(v => (v ? "#" : ".")).join(""));
  }

  // ---- grid rendering ----
  function buildGrid() {
    gridEl.style.gridTemplateColumns = `repeat(${W}, 22px)`;
    gridEl.innerHTML = "";
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const b = document.createElement("button");
        b.className = "cell";
        b.dataset.x = x; b.dataset.y = y;
        b.setAttribute("aria-label", `${x},${y}`);
        gridEl.appendChild(b);
      }
    }
    paintAll();
    drawGuides();
    drawGhost();
  }
  function paintAll() {
    const nodes = gridEl.children;
    for (let i = 0; i < nodes.length; i++) {
      const x = +nodes[i].dataset.x, y = +nodes[i].dataset.y;
      nodes[i].classList.toggle("on", cells[y][x]);
    }
    updatePreview();
  }
  function setCell(x, y, val) {
    if (y < 0 || y >= H || x < 0 || x >= W) return;
    if (cells[y][x] === val) return;
    cells[y][x] = val;
    const idx = y * W + x;
    gridEl.children[idx].classList.toggle("on", val);
  }

  // ---- painting ----
  let painting = false, paintVal = true;
  function cellAt(t) {
    if (!t || !t.classList || !t.classList.contains("cell")) return null;
    return { x: +t.dataset.x, y: +t.dataset.y };
  }
  gridEl.addEventListener("pointerdown", e => {
    const c = cellAt(e.target); if (!c) return;
    e.preventDefault();
    painting = true;
    paintVal = !cells[c.y][c.x];
    setCell(c.x, c.y, paintVal);
    gridEl.setPointerCapture(e.pointerId);
  });
  gridEl.addEventListener("pointermove", e => {
    if (!painting) return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const c = cellAt(t); if (!c) return;
    setCell(c.x, c.y, paintVal);
  });
  function endPaint() { if (painting) { painting = false; updatePreview(); } }
  gridEl.addEventListener("pointerup", endPaint);
  gridEl.addEventListener("pointercancel", endPaint);
  window.addEventListener("pointerup", endPaint);
  // keyboard toggle on focused cell
  gridEl.addEventListener("keydown", e => {
    const c = cellAt(e.target); if (!c) return;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      setCell(c.x, c.y, !cells[c.y][c.x]); updatePreview();
    }
  });

  // ---- guides ----
  function drawGuides() {
    guidesEl.innerHTML = "";
    guidesEl.style.display = guidesOn ? "block" : "none";
    if (!guidesOn) return;
    const ch = 100 / H;
    const lines = [[2, "cap"], [6, "x-height"], [13, "baseline"]];
    for (const [row, name] of lines) {
      const d = document.createElement("div");
      d.className = "gline";
      d.style.top = (row * ch) + "%";
      d.innerHTML = `<b>${name}</b>`;
      guidesEl.appendChild(d);
    }
    if (W === 16) {
      const v = document.createElement("div");
      v.className = "vline"; v.style.left = "50%";
      guidesEl.appendChild(v);
    }
  }

  // ---- ghost overlays ----
  // Three overlays, all gated by the 참조 오버레이 toggle:
  //  - #ghost (--ink): the other weight of the SAME character, whichever one
  //    is the reference for what you're drawing. On the Regular tab for
  //    Hangul, the original Bold skeleton to thin down from.
  //  - purple (#ghostRef2, --guide2): the "참고" field's character in the
  //    CURRENT weight, so a similar already-drawn glyph can be traced against.
  //  - blue (#ghostSym, --guide): DKBDinaru, for symbols/punctuation only
  //    (see /api/symref). Shape reference; still redrawn by hand.
  function isHangul(ch) {
    const c = ch.codePointAt(0);
    return (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3130 && c <= 0x318F);
  }
  // Everything that isn't Hangul gets the DKBDinaru reference: Latin,
  // digits, punctuation, currency, math, arrows, box drawing, blocks, shapes.
  function isSymRef(ch) { return !isHangul(ch); }
  // One fetch for all three reference sources -- they differ only in URL.
  // Caches null on failure too, so a miss isn't retried on every repaint;
  // `ch in cache` (not truthiness) is what tells "already asked" from "not
  // asked yet". Redraws when it lands, unless the user moved on since.
  function refFetcher(url) {
    const cache = {};
    async function fetch1(ch) {
      try {
        const res = await fetch(url(ch), { cache: "no-store" });
        const j = res.ok ? await res.json() : null;
        cache[ch] = (j && j.chars && j.chars[0] && j.chars[0].rows) || null;
      } catch (e) {
        cache[ch] = null;
      }
      if (ch === curChar) drawGhost();
    }
    // Returns the rows if known, else kicks off the fetch and returns null.
    return ch => (ch in cache ? cache[ch] : (fetch1(ch), null));
  }
  const refText = w => ch => `api/text?weight=${w}&s=` + encodeURIComponent(ch);
  const boldRef = refFetcher(refText("regular"));
  const symRef = refFetcher(ch => "api/symref?s=" + encodeURIComponent(ch));
  function paintGhost(cv, rows, colorVar) {
    const px = 22;
    cv.width = W * px; cv.height = H * px;
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!rows) return;
    const gw = rows[0].length;
    const dx = Math.floor((W - gw) / 2);   // center if narrower than canvas
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(colorVar);
    for (let y = 0; y < H; y++)
      for (let x = 0; x < gw; x++)
        if (rows[y][x] === "#")
          ctx.fillRect((dx + x) * px, y * px, px, px);
  }
  function drawGhost() {
    let rows = null;
    if (ghostOn && WEIGHT === "light" && isHangul(curChar)) {
      // Bold on purpose, unthinned: it shows the original skeleton as drawn,
      // and deciding which stroke survives the 1px reduction is a visual call
      // to make against it, not something to pre-apply.
      rows = boldRef(curChar);
    }
    paintGhost(document.getElementById("ghost"), rows, "--ink");
    drawSymGhost();
    drawRefGhost();
  }
  function drawSymGhost() {
    const rows = ghostOn && isSymRef(curChar) ? symRef(curChar) : null;
    paintGhost(document.getElementById("ghostSym"), rows, "--guide");
  }
  let refChar = "";
  function drawRefGhost() {
    let rows = null;
    if (ghostOn && refChar && refChar !== curChar) rows = paletteSource(refChar);
    paintGhost(document.getElementById("ghostRef2"), rows, "--guide2");
  }
  document.getElementById("refCharInput").addEventListener("input", e => {
    refChar = Array.from(e.target.value)[0] || "";
    drawRefGhost();
  });

  // ---- preview ----
  function renderTo(canvas, scale) {
    canvas.width = W * scale; canvas.height = H * scale;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink");
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++)
        if (cells[y][x]) ctx.fillRect(x * scale, y * scale, scale, scale);
  }
  function updatePreview() {
    renderTo(document.getElementById("pv1"), 1);
    renderTo(document.getElementById("pv2"), 2);
    renderTo(document.getElementById("pv3"), 3);
  }

  // ---- palette ----
  function paletteSource(ch) {
    return DATA[ch] ? DATA[ch].rows : (paletteData[ch] || null);
  }
  // The one swatch builder. Both palettes (the character sets and 부품 셀's
  // affected-syllable list) go through it, so state colours, canvas sizing and
  // the title wording can't drift apart -- they had, down to calling the same
  // state "저장된 확정본" in one and "확정본" in the other.
  //   confirmed: hand-drawn and saved (green)   composed: derived preview
  //   neither:   nothing to show yet (dashed)
  function swatchFor(ch, rows, confirmed, blockedNote) {
    const s = document.createElement("button");
    s.className = "swatch" + (confirmed ? " saved" : "") + (rows ? "" : " empty");
    s.dataset.ch = ch;
    s.title = ch + (confirmed ? " (확정본)" : rows ? " (조합)" : (blockedNote || " (안 그려짐)"));
    const cv = document.createElement("canvas");
    const w = rows ? rows[0].length : canonicalWidth(ch);
    cv.width = w; cv.height = H;
    if (rows) {
      const ctx = cv.getContext("2d");
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink");
      for (let y = 0; y < H; y++)
        for (let x = 0; x < w; x++)
          if (rows[y] && rows[y][x] === "#") ctx.fillRect(x, y, 1, 1);
    }
    s.appendChild(cv);
    s.addEventListener("click", () => loadChar(ch));
    return s;
  }
  function buildPaletteGroup(containerId, chars) {
    const pal = document.getElementById(containerId);
    pal.innerHTML = "";
    for (const ch of chars)
      pal.appendChild(swatchFor(ch, paletteSource(ch), !!DATA[ch]));
  }
  function ensureSymbolGroupsDom() {
    const wrap = document.getElementById("paletteSymbolsWrap");
    if (wrap.dataset.built) return;
    wrap.dataset.built = "1";
    for (const [key, label, chars] of SYMBOL_GROUPS) {
      const group = document.createElement("div");
      group.className = "palette-group";
      const p = document.createElement("p");
      p.className = "sublabel";
      p.textContent = `${label} (${Array.from(chars).length}자)`;
      const pal = document.createElement("div");
      pal.className = "palette";
      pal.id = `paletteSym-${key}`;
      group.appendChild(p);
      group.appendChild(pal);
      wrap.appendChild(group);
    }
  }
  function buildPalette() {
    buildPaletteGroup("paletteHalf", Array.from(HALF_CHARS));
    buildPaletteGroup("paletteFull", Array.from(FULL_CHARS));
    buildPaletteGroup("paletteAll2350", KS2350_CHARS);
    ensureSymbolGroupsDom();
    for (const [key, , chars] of SYMBOL_GROUPS)
      buildPaletteGroup(`paletteSym-${key}`, Array.from(chars));
  }
  async function loadPaletteData() {
    // Palette is the same character set for both weights; the swatch content
    // just follows the active weight (server fills unsaved glyphs per weight).
    paletteData = {};
    const symbolChars = SYMBOL_GROUPS.map(([, , chars]) => chars).join("");
    const chars = HALF_CHARS + FULL_CHARS + KS2350_CHARS.join("") + symbolChars;
    try {
      const res = await fetch("api/text?weight=" + WEIGHT + "&s=" + encodeURIComponent(chars),
                              { cache: "no-store" });
      if (res.ok) {
        const j = await res.json();
        for (const item of j.chars) if (item.rows) paletteData[item.ch] = item.rows;
      }
    } catch (e) { /* offline: palette falls back to customized chars only */ }
  }
  function markPalette() {
    document.querySelectorAll(".swatch").forEach(s =>
      s.classList.toggle("active", s.dataset.ch === curChar));
  }

  // ---- load / char ----
  // Advance width is a FIXED property of the character, never of editor state.
  // Derived from the existing data (all 2,900+ saved glyphs agree): 8px for
  // ASCII and the halfwidth forms block, 16px for everything else -- Hangul,
  // CJK punctuation, fullwidth forms, and every symbol block including
  // Latin-1 (±, ×, ÷ are fullwidth here, following KS X 1001).
  function widthFor(ch) {
    const c = ch.codePointAt(0);
    if (c >= 0x20 && c <= 0x7E) return 8;      // ASCII printable
    if (c >= 0xFF61 && c <= 0xFFDC) return 8;  // halfwidth punctuation + jamo
    return 16;
  }
  // A saved glyph's own width wins: it is the glyph that actually exists, and
  // silently re-flowing it to a different width would corrupt real work.
  function canonicalWidth(ch) {
    const rows = paletteSource(ch);
    return rows ? rows[0].length : widthFor(ch);
  }
  async function loadChar(ch) {
    curChar = ch;
    charInput.value = ch;
    setWidth(canonicalWidth(ch), true);   // always explicit -- never inherited
    let rows = paletteSource(ch);
    cells = rows ? rowsToCells(rows) : blank(W);
    cpLabel.textContent = "U+" + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0");
    buildGrid();
    markPalette();
    if (rows || !SERVER) return;
    // paletteSource only knows the precomputed sets (완성형 2,350, Latin,
    // symbols) -- anything else (조합형-only Hangul outside those 2,350, e.g.
    // representative syllables for the component editor) falls through as
    // blank even when the server actually has real data for it. Fetch this
    // one character on demand rather than leaving the canvas empty.
    try {
      const j = await (await fetch("api/text?weight=" + WEIGHT + "&s=" + encodeURIComponent(ch),
                                   { cache: "no-store" })).json();
      rows = (j.chars && j.chars[0] && j.chars[0].rows) || null;
    } catch (e) { rows = null; }
    if (ch !== curChar || !rows) return;   // stale response, or genuinely blank
    if (rows[0].length !== W) setWidth(rows[0].length, true);
    cells = rowsToCells(rows);
    buildGrid();
  }
  charInput.addEventListener("input", () => {
    const v = charInput.value;
    if (!v) return;
    const ch = Array.from(v)[0];
    loadChar(ch);
  });

  // ---- width ----
  function setWidth(w, silent) {
    if (w !== W) {
      const old = cells;
      W = w;
      cells = blank(W);
      for (let y = 0; y < H; y++)
        for (let x = 0; x < Math.min(w, old[0].length); x++)
          cells[y][x] = old[y][x] || false;
    }
    // Always refresh the readout, even when the width didn't change -- it is
    // a display of the current character's fixed width, not a control.
    document.getElementById("widthLabel").textContent = W + "px";
    if (!silent) buildGrid();
  }

  // ---- guides toggle ----
  document.getElementById("guideBtn").addEventListener("click", e => {
    guidesOn = !guidesOn;
    e.currentTarget.setAttribute("aria-pressed", guidesOn);
    drawGuides();
  });
  document.getElementById("ghostBtn").addEventListener("click", e => {
    ghostOn = !ghostOn;
    e.currentTarget.setAttribute("aria-pressed", ghostOn);
    drawGhost();
  });

  // ---- tools ----
  let gridClipboard = null; // { w, rows: boolean[][] } -- in-memory, cross-character
  // Delegated from .side-controls, not .tools: 저장/원래대로/비우기 live in the
  // separate .row-actions row above it, and a ".tools"-only selector never
  // caught clicks there (same bug, same fix, as halfwidth_editor.html's
  // .tools/.draw-card split).
  document.querySelector(".side-controls").addEventListener("click", e => {
    const act = e.target.dataset.act; if (!act) return;
    if (act === "clear") cells = blank(W);
    else if (act === "up") cells = shift(0, -1);
    else if (act === "down") cells = shift(0, 1);
    else if (act === "left") cells = shift(-1, 0);
    else if (act === "right") cells = shift(1, 0);
    else if (act === "copygrid") {
      gridClipboard = { w: W, rows: cells.map(r => [...r]) };
      showToast(`복사됨 · ${curChar} (${cpLabel.textContent})`, "success");
      return;
    } else if (act === "pastegrid") {
      if (!gridClipboard) { showToast("복사된 칸이 없습니다", "error"); return; }
      // Paste pixels, never the source glyph's width -- the target character's
      // width is fixed. Crop if the copy was wider, left-align if narrower.
      cells = blank(W);
      const src = gridClipboard.rows, sw = gridClipboard.w;
      for (let y = 0; y < H; y++)
        for (let x = 0; x < Math.min(W, sw); x++)
          cells[y][x] = src[y][x] || false;
      if (sw !== W) showToast(`${sw}px → ${W}px로 맞춰 붙여넣음`, "info");
      buildGrid();
      return;
    } else if (act === "revert") {
      setWidth(canonicalWidth(curChar), true);
      const rows = paletteSource(curChar);
      cells = rows ? rowsToCells(rows) : blank(W);
      buildGrid();
      showToast(`저장된 상태로 되돌림 · ${curChar}`, "success");
      return;
    }
    paintAll();
  });
  function shift(dx, dy) {
    const out = blank(W);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ny = y + dy, nx = x + dx;
      if (ny >= 0 && ny < H && nx >= 0 && nx < W) out[ny][nx] = cells[y][x];
    }
    return out;
  }

  // ---- server integration ----
  const statusEl = document.getElementById("status");
  const saveBtn = document.getElementById("saveOne");
  const buildBtn = document.getElementById("buildFont");
  const bmpBtn = document.getElementById("buildBmp");

  function setStatus(on, text) {
    SERVER = on;
    statusEl.dataset.on = on ? "true" : "false";
    statusEl.textContent = text;
    saveBtn.hidden = !on;    // offline there is nowhere to save to
    buildBtn.hidden = !on;
    bmpBtn.hidden = !on;
    syncCellsTab();          // 부품 셀 needs the server too
  }

  async function fetchWeightData(weight) {
    const res = await fetch("api/glyphs?weight=" + weight, { cache: "no-store" });
    if (!res.ok) throw new Error("no api");
    const src = await res.json();                // { "A": [rows], ... }
    const out = {};
    for (const ch in src) out[ch] = { rows: src[ch] };
    return out;
  }

  async function connect() {
    try {
      DATA = await fetchWeightData(WEIGHT);
      setStatus(true, "서버 연결됨 · 저장 가능");
      await fetchKs2350();
      await loadPaletteData();
      buildPalette();
      loadChar(paletteSource(curChar) ? curChar : defaultCharFor(WEIGHT));
    } catch (e) {
      setStatus(false, "오프라인 · 저장 불가");
    }
  }

  function defaultCharFor(weight) {
    return weight === "light" ? (KS2350_CHARS[0] || "가") : "A";
  }

  async function switchWeight(weight) {
    if (weight === WEIGHT) return;
    WEIGHT = weight;
    document.querySelectorAll(".wtab").forEach(b =>
      b.setAttribute("aria-selected", b.dataset.weight === weight ? "true" : "false"));
    if (SERVER) {
      try {
        DATA = await fetchWeightData(weight);
        await loadPaletteData();     // refetch swatch content for the new weight
      } catch (e) {
        DATA = {};
      }
    }
    buildPalette();
    syncCellsTab();
    loadChar(defaultCharFor(weight));
  }
  document.querySelectorAll(".wtab").forEach(b =>
    b.addEventListener("click", () => switchWeight(b.dataset.weight)));

  // ---- palette category tabs ----
  function selectCat(cat) {
    document.querySelectorAll(".ptab").forEach(x =>
      x.setAttribute("aria-selected", x.dataset.cat === cat ? "true" : "false"));
    document.querySelectorAll(".palette-cat").forEach(el =>
      el.hidden = el.dataset.cat !== cat);
    if (cat === "cells" && !CELLS.length) refreshCells();
  }
  document.querySelectorAll(".ptab").forEach(b =>
    b.addEventListener("click", () => selectCat(b.dataset.cat)));

  // ---- palette swatch zoom (applies to every category, incl. 부품 셀) ----
  document.querySelectorAll("[data-swscale]").forEach(b =>
    b.addEventListener("click", () => {
      document.documentElement.style.setProperty("--sw-cv", (16 * +b.dataset.swscale) + "px");
      document.querySelectorAll("[data-swscale]").forEach(x =>
        x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    }));

  // The component model only describes Light (1px) Hangul, so the 부품 셀 tab
  // only exists on that weight. Hiding it beats letting it be picked and then
  // switching the weight out from under the user -- that had the cell's own
  // loadChar racing the one switchWeight fires for its default character.
  // The tab also needs the server: its list and preview are computed by
  // /api/cells and /api/cell_preview, so with the file opened directly it
  // would be a tab that silently shows an empty table.
  function syncCellsTab() {
    const tab = document.querySelector('.ptab[data-cat="cells"]');
    const on = WEIGHT === "light" && SERVER;
    tab.hidden = !on;
    if (!on && tab.getAttribute("aria-selected") === "true") selectCat("hangul");
  }

  // ---- 부품 셀 (11,172자 확장) ----
  // Was its own page/file; the drawing half was a duplicate of this editor's,
  // so the same fix had to be made twice every time. Only the "what do I draw
  // next" half is specific, and that is all this section is: pick a cell, and
  // its representative syllable loads into the canvas above like any other
  // palette entry. Saving goes through the normal save path.
  let CELLS = [], curCell = null, cellTodoOnly = false;
  const cellRowsEl = document.getElementById("cellRows");
  const cmpJ = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

  function renderCellList() {
    // 그릴 셀만 필터는 실제로 그려서 풀 수 있는 것만 남긴다. stuck은 samples
    // === 0이지만 후보 전부가 이미 확정본이라 -- 다시 그려도 안 바뀌고 추출
    // 가드 문제라 필터에도, "그릴 것" 집계에도 안 들어간다.
    const todoable = c => c.samples === 0 && !c.stuck;
    // 가나다순, by id ("LV:ㄱㅏ:False") -- that already reads kind, then jamo,
    // then 벌, and plain codepoint order on the compatibility-jamo block IS
    // the standard order (초성/중성 never include clusters, and for 종성 the
    // block interleaves them exactly where 가나다 wants them). Sorting on the
    // displayed 벌 instead would order by its Korean label, which is unrelated.
    const shown = CELLS.filter(c => !cellTodoOnly || todoable(c))
      .sort((a, b) => cmpJ(a.id, b.id));
    cellRowsEl.innerHTML = "";
    for (const c of shown) {
      // One badge per row: 그릴 것 when actually drawable-and-empty, 추출 안 됨
      // when stuck, sample count otherwise. The count is NOT a confidence
      // score -- how much samples disagree measures the 받침 zone cut and the
      // user's optical corrections, not quality.
      const state = c.stuck
        ? `<span class="pill warn" title="이 셀을 쓰는 음절이 전부 이미 확정본인데도 셀이 비어 있습니다. 새로 그려서 해결되지 않습니다.">추출 안 됨</span>`
        : todoable(c) ? `<span class="pill empty">그릴 것</span>`
        : `<span class="pill">샘플 ${c.samples}</span>`;
      const tr = document.createElement("tr");
      tr.className = "row";
      tr.setAttribute("aria-selected", curCell && curCell.id === c.id ? "true" : "false");
      tr.innerHTML =
        `<td><span class="jamo">${c.jamo}</span> <span class="pill">${c.kind}</span></td>` +
        `<td>${c.beol}</td><td>${state}</td><td>${c.affects}</td>` +
        `<td class="jamo">${c.suggest || "—"}` +
        (c.suggest && !c.resolvable
          ? ` <span class="pill warn" title="다른 셀이 먼저 안 풀려서, 이 글자만 그리면 이 셀도 계속 빈 채로 남습니다.">순서 필요</span>` : "") +
        `</td>`;
      tr.addEventListener("click", () => selectCell(c));
      cellRowsEl.appendChild(tr);
    }
    const todo = CELLS.filter(todoable).length;
    const stuck = CELLS.filter(c => c.stuck).length;
    document.getElementById("cellCount").textContent =
      `${shown.length}셀` +
      (cellTodoOnly || !todo ? "" : ` · 그릴 것 ${todo}`) +
      (cellTodoOnly || !stuck ? "" : ` · 추출 안 됨 ${stuck}`);
  }
  document.getElementById("cellTodoOnly").addEventListener("change", e => {
    cellTodoOnly = e.target.checked;
    renderCellList();
  });

  async function selectCell(c) {
    curCell = c;
    renderCellList();
    // A filled cell has no suggestion (drawing a new syllable can't move a
    // cell that's already resolved), so fall back to one of its own confirmed
    // syllables -- that both fills the canvas and anchors the preview below.
    const ch = c.suggest || (c.examples || [])[0];
    if (ch) await loadChar(ch);     // always Light here -- see syncCellsTab
    renderCellPreview(ch);
  }

  async function renderCellPreview(ch) {
    const meta = document.getElementById("cellPrevMeta");
    const pal = document.getElementById("paletteCells");
    const box = document.getElementById("cellPrevBox");
    const empty = document.getElementById("cellPrevEmpty");
    const show = (on, text) => {
      box.hidden = !on; empty.hidden = on;
      (on ? meta : empty).textContent = text;
    };
    if (!curCell || !ch) { pal.innerHTML = ""; show(false, "셀을 고르세요"); return; }
    show(true, "계산 중…");
    let out;
    try {
      const res = await fetch("api/cell_preview", {
        method: "POST", headers: { "Content-Type": "application/json" },
        // scope to the selected cell, or the anchor's OTHER cell drags in
        // syllables that don't use this component at all
        body: JSON.stringify({ ch, rows: cellsToRows(), cell: curCell.id }),
      });
      // fetch does NOT reject on an HTTP error status, so without this an
      // error body parses to .chars === undefined and reads as a legitimate
      // "0 syllables" instead of a failure.
      if (!res.ok) throw new Error(await res.text().catch(() => res.status));
      out = (await res.json()).chars || [];
    } catch (e) {
      pal.innerHTML = ""; show(false, "미리보기 실패");
      showToast(`미리보기 실패 · ${String(e.message || e)}`, "error");
      return;
    }
    pal.innerHTML = "";
    let composed = 0;
    for (const c of out) {
      if (c.rows) composed++;
      // Uncomposable ones stay clickable and matter MOST -- drawing one is
      // exactly what fills the empty cell blocking it.
      pal.appendChild(swatchFor(c.ch, c.rows, c.confirmed,
        " — 다른 셀이 아직 비어 조합 불가. 눌러서 직접 그리면 채워집니다."));
    }
    show(true, `이 부품을 쓰는 음절 ${out.length}개 · 조합됨 ${composed}`);
    markPalette();
  }

  async function refreshCells() {
    if (!SERVER) return;
    try {
      const res = await fetch("api/cells", { cache: "no-store" });
      if (!res.ok) throw new Error(await res.text().catch(() => res.status));
      CELLS = (await res.json()).cells || [];
    } catch (e) {
      showToast(`셀 목록 실패 · ${String(e.message || e)}`, "error");
      return;
    }
    if (curCell) curCell = CELLS.find(c => c.id === curCell.id) || curCell;
    renderCellList();
  }

  // ---- toast ----
  const toastsEl = document.getElementById("toasts");
  function showToast(message, kind) {
    const el = document.createElement("div");
    el.className = "toast";
    el.dataset.kind = kind || "info";
    el.innerHTML = `<span class="dot"></span><span></span>`;
    el.lastElementChild.textContent = message;
    toastsEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    const life = kind === "error" ? 4200 : 2400;
    setTimeout(() => {
      el.classList.remove("show");
      el.addEventListener("transitionend", () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 300); // fallback if no transition fires
    }, life);
  }

  async function saveCurrent() {
    const body = {}; body[curChar] = cellsToRows();
    const res = await fetch("api/glyphs?weight=" + WEIGHT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const msg = await res.text().catch(() => "");
      throw new Error(`저장 실패 (${res.status}) ${msg}`.trim());
    }
    const j = await res.json();
    DATA[curChar] = { rows: cellsToRows() };
    buildPalette(); markPalette();
    // Cell status is derived from the confirmed corpus, so a save can fill or
    // change a cell -- recompute rather than leaving a stale worklist.
    if (CELLS.length) {
      await refreshCells();
      if (curCell) renderCellPreview(curChar);
    }
    return j;
  }

  document.getElementById("saveOne").addEventListener("click", async e => {
    const btn = e.currentTarget; const t = btn.textContent;
    btn.disabled = true;
    try {
      await saveCurrent();
      showToast(`저장됨 · ${curChar} (${cpLabel.textContent})`, "success");
      btn.textContent = "저장됨 ✓";
    } catch (err) {
      showToast(String(err.message || err), "error");
      btn.textContent = "저장 실패";
    } finally {
      setTimeout(() => { btn.textContent = t; btn.disabled = false; }, 1200);
    }
  });

  document.getElementById("buildFont").addEventListener("click", async e => {
    const btn = e.currentTarget; const t = btn.textContent;
    btn.disabled = true;
    let allOk = true;
    // internal weight key -> compiled family member it produces
    const ROLE = { light: "Regular", regular: "Bold" };
    for (const weight of ["light", "regular"]) {
      const role = ROLE[weight];
      btn.textContent = `빌드 중… (${role})`;
      console.log(`[빌드:${role}] 시작…`);
      try {
        const res = await fetch("api/build?weight=" + weight, { method: "POST" });
        const j = await res.json();
        console.log(`[빌드:${role}] ${j.ok ? "완료 ✓" : "실패"}\n${j.log || ""}`);
        if (!j.ok) allOk = false;
      } catch (err) {
        console.error(`[빌드:${role}] 요청 실패:`, err);
        allOk = false;
      }
    }
    showToast(allOk ? "빌드 완료 ✓ (Regular + Bold)" : "빌드 실패 — 콘솔 확인",
              allOk ? "success" : "error");
    btn.disabled = false; btn.textContent = t;
  });

  document.getElementById("buildBmp").addEventListener("click", async e => {
    const btn = e.currentTarget; const t = btn.textContent;
    btn.disabled = true; btn.textContent = "BMP 작성 중…";
    console.log("[BMP] 시작…");
    try {
      const res = await fetch("api/build_bmp", { method: "POST" });
      const j = await res.json();
      console.log(`[BMP] ${j.ok ? "완료 ✓" : "실패"}\n${j.log || ""}`);
      showToast(j.ok ? "BMP 작성 완료 ✓ (build/font_light.bmp)" : "BMP 작성 실패 — 콘솔 확인",
                j.ok ? "success" : "error");
    } catch (err) {
      console.error("[BMP] 요청 실패:", err);
      showToast("BMP 작성 실패 — 콘솔 확인", "error");
    }
    btn.disabled = false; btn.textContent = t;
  });

  // ---- init ----
  buildPalette();
  syncCellsTab();
  loadChar("A");
  connect().then(() => {
    // /components redirects here with #cells so old bookmarks land on the tab
    // that replaced that page.
    if (location.hash === "#cells" && WEIGHT === "light") selectCat("cells");
  });
})();
</script>
