<link rel="stylesheet" href="editor.css">
<style>
  /* Page-specific only -- shared tokens/.app/.topbar/.card/.btn/.status/.toast
     live in editor.css. */
  .seg { display: inline-flex; border: 1px solid var(--grid-line); border-radius: 8px;
         overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted);
                font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--grid-line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  textarea { width: 100%; min-height: 90px; resize: vertical; font: inherit;
             font-size: 15px; padding: 10px 12px; border: 1px solid var(--grid-line);
             border-radius: 8px; background: var(--panel); color: var(--ink); }

  .scale-row { display: flex; align-items: center; gap: 8px; margin-top: 10px;
               font-size: 12px; color: var(--muted); }
  .scale-row input[type="range"] { width: 160px; }

  .lines-box { resize: both; overflow: auto; min-width: 200px; min-height: 60px;
               max-width: 100%; padding: 4px; }
  .lines { display: flex; flex-direction: column; gap: 2px; width: max-content; }
  .line { display: flex; align-items: flex-end; }
  .line:empty::before { content: ""; display: block; height: 1em; }
  .glyph canvas { image-rendering: pixelated; display: block; }
</style>

<div class="app">
  <header class="topbar">
    <h1>미리 써보기</h1>
    <div class="seg" role="tablist" aria-label="웨이트">
      <button type="button" data-weight="light" aria-pressed="true">Regular</button>
      <button type="button" data-weight="regular" aria-pressed="false">Bold</button>
    </div>
    <span class="status" id="status">불러오는 중…</span>
  </header>

  <div class="card">
    <div class="seg" id="presets" style="margin-bottom: 10px;">
      <button type="button" data-preset="body">본문</button>
      <button type="button" data-preset="symbols">기호</button>
      <button type="button" data-preset="jamo">자모</button>
      <button type="button" data-preset="review">검수</button>
    </div>
    <textarea id="input" spellcheck="false" placeholder="여기 입력…">가나다라 도깨비DNR 고딕 ABCDEFG 0123456789</textarea>
    <div class="scale-row">
      <label for="scale">배율</label>
      <input type="range" id="scale" min="1" max="8" step="1" value="3">
      <span id="scaleLabel">3x</span>
    </div>
  </div>

  <div class="card" style="margin-top: 16px;">
    <div class="lines-box">
      <div class="lines" id="lines"></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
  const statusEl = document.getElementById("status");
  const toastsEl = document.getElementById("toasts");
  const input = document.getElementById("input");
  const linesEl = document.getElementById("lines");
  const scaleEl = document.getElementById("scale");
  const scaleLabel = document.getElementById("scaleLabel");
  const weightSeg = document.querySelector(".seg");

  let WEIGHT = "light";
  let SCALE = Number(scaleEl.value);
  const cache = {}; // WEIGHT -> { ch: rows|null }

  function showToast(message, kind) {
    const el = document.createElement("div");
    el.className = "toast";
    el.dataset.kind = kind || "info";
    el.innerHTML = `<span class="dot"></span><span></span>`;
    el.lastElementChild.textContent = message;
    toastsEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    const life = kind === "error" ? 4200 : 2400;
    setTimeout(() => {
      el.classList.remove("show");
      el.addEventListener("transitionend", () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 300);
    }, life);
  }

  function glyphCanvas(ch, rows) {
    const wrap = document.createElement("span");
    wrap.className = "glyph";
    const cv = document.createElement("canvas");
    const w = rows ? rows[0].length : 16;
    cv.width = w; cv.height = 16;
    cv.style.height = (16 * SCALE) + "px";
    cv.style.width = (w * SCALE) + "px";
    if (rows) {
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#191c22";
      for (let y = 0; y < 16; y++)
        for (let x = 0; x < w; x++)
          if (rows[y][x] === "#") ctx.fillRect(x, y, 1, 1);
    } else {
      cv.title = ch + " (없음)";
      cv.style.opacity = "0.15";
    }
    wrap.appendChild(cv);
    return wrap;
  }

  async function fetchMissing(chars) {
    const bucket = cache[WEIGHT] || (cache[WEIGHT] = {});
    const need = [...new Set(chars)].filter(ch => !(ch in bucket) && ch !== "\n");
    if (!need.length) return;
    try {
      const res = await fetch("api/text?weight=" + WEIGHT + "&s=" + encodeURIComponent(need.join("")),
                              { cache: "no-store" });
      if (!res.ok) throw new Error(await res.text().catch(() => res.status));
      const j = await res.json();
      for (const c of j.chars) bucket[c.ch] = c.rows || null;
    } catch (e) {
      showToast(`불러오기 실패 · ${String(e.message || e)}`, "error");
    }
  }

  function render() {
    const bucket = cache[WEIGHT] || {};
    linesEl.innerHTML = "";
    for (const line of input.value.split("\n")) {
      const lineEl = document.createElement("div");
      lineEl.className = "line";
      for (const ch of line) lineEl.appendChild(glyphCanvas(ch, bucket[ch]));
      linesEl.appendChild(lineEl);
    }
  }

  async function refresh() {
    await fetchMissing([...input.value].filter(ch => ch !== "\n"));
    render();
  }

  // 교정쇄 프리셋 -- 글리프 단위 검수가 못 잡는 문맥 품질(이웃 글자와의 간격,
  // 한/영 경계, 문장부호 주변)을 고정 표본으로 훑는다. "검수"의 1행은 실사용
  // 코퍼스 기준 미확정(조합 출력) 음절 상위 50(scripts/freq_worklist.py,
  // OpenSubtitles 2018 스냅샷), 2행은 2px 줄기 체에 걸린 20자(--stems).
  const PRESETS = {
    body: "다람쥐 헌 쳇바퀴에 타고파. 조용한 새벽, 국물 맛이 퍽 깊다.\n" +
          "“어디까지 왔어?” (거의 다 왔지!) 3번 출구, 오전 10:45.\n" +
          "Retro pixel type: ABC abc 0123456789 #&@%",
    symbols: "·… ,.!? ;: ‘’ “” 〈〉《》「」『』【】 ()[]{}\n" +
             "+−±×÷=≠≤≥ ←↑→↓ ₩￦$°℃\n" +
             "─│┌┐└┘├┤┬┴┼ ▀▄█░▒▓ ■□●○◆◇★☆",
    jamo: "ㅋㅋㅋ ㅎㅎ ㅠㅠ ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ ㄲㄸㅃㅆㅉ\n" +
          "ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ ㅐㅒㅔㅖ ㅘㅙㅚㅝㅞㅟㅢ\n" +
          "ㅥㅦㅧㅨㅩㅪㅫㅬㅭㅮㅯㅰㅱㅲㅳㅴㅵㅶㅷㅸㅹㅺㅻㅼㅽㅾㅿㆀㆁㆂㆃㆄㆅㆆㆇㆈㆉㆊㆋㆌㆍㆎ",
    review: "혻됬깄쫒잌됀썻슌됏핳 젋봣맄낰뵜찟됭눞졋섍 딫뼡뵒꾨썪뤀쾶뷱뼱톸 쎘쒖퀬햝헸뭥빐줐괞맽 쓣밷퀠먄맟꿧맀뿰븣쫫\n" +
            "뒦뛐뷖뷯쀀쀢쉮슇쒺쓓 쥫쮞쮷츃퀔퀶큍큏퓥퓧",
  };
  document.getElementById("presets").addEventListener("click", e => {
    const btn = e.target.closest("button[data-preset]");
    if (!btn) return;
    input.value = PRESETS[btn.dataset.preset];
    refresh();
  });

  let debounce;
  input.addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(refresh, 150);
  });
  scaleEl.addEventListener("input", () => {
    SCALE = Number(scaleEl.value);
    scaleLabel.textContent = SCALE + "x";
    render();
  });
  weightSeg.addEventListener("click", e => {
    const btn = e.target.closest("button[data-weight]");
    if (!btn) return;
    WEIGHT = btn.dataset.weight;
    for (const b of weightSeg.querySelectorAll("button"))
      b.setAttribute("aria-pressed", b === btn);
    refresh();
  });

  statusEl.textContent = "준비됨";
  refresh();
</script>
