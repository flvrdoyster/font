<style>
  :root {
    --ground: #eef0f4; --panel: #ffffff; --ink: #191c22; --muted: #5c6270;
    --faint: #d6dae2; --cell-off: #f7f8fb; --accent: #a4610a; --accent-soft: #f0e2cf;
    --grid-line: #c9ced9; --confirm: #2e8b4f; --warn: #b3392c;
    --ref: #2f6fe0; --ref2: #9333c9; --ref3: #0d8a76;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #14161b; --panel: #1d2027; --ink: #e9ecf2; --muted: #99a0af;
      --faint: #2b2f38; --cell-off: #23262e; --accent: #e2ab52; --accent-soft: #3a2f1c;
      --grid-line: #383d47; --confirm: #4fbf78; --warn: #e0705f;
      --ref: #6ea2ff; --ref2: #c68ce8; --ref3: #4fd1b5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--ground); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  code { font-family: var(--mono); font-size: 12px; background: var(--cell-off);
         padding: 1px 5px; border-radius: 4px; }
  .layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--faint);
          border-radius: 12px; padding: 14px; }
  .list-card { flex: 1 1 420px; min-width: 340px; }
  .tabbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab { font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
         border: 1px solid var(--grid-line); border-radius: 8px;
         background: var(--panel); color: var(--muted); }
  .tab[aria-selected="true"] { border-color: var(--accent);
         background: var(--accent-soft); color: var(--ink); }
  .rows { max-height: 620px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px;
       padding: 4px 6px; position: sticky; top: 0; background: var(--panel); }
  td { padding: 4px 6px; border-top: 1px solid var(--faint); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--cell-off); }
  tr.row[aria-selected="true"] td { background: var(--accent-soft); }
  .jamo { font-size: 15px; font-weight: 600; }
  .pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 99px;
          border: 1px solid var(--grid-line); color: var(--muted); }
  .pill.empty { border-color: var(--warn); color: var(--warn); }
  .pill.warn { border-color: var(--accent); color: var(--accent); }
  .pill.ok { border-color: var(--confirm); color: var(--confirm); }
  /* Fixed width, not flex:0 0 auto -- an auto-basis flex item sizes to its
     widest unbroken content (min-width:auto default), so the long "순서 필요"
     warning line in #cellMeta forced the whole card wide instead of wrapping. */
  .draw-card { flex: 0 0 380px; width: 380px; }
  .cellname { font-family: var(--mono); font-size: 13px; margin-bottom: 2px; }
  .cellname .cp { font-size: 11px; color: var(--muted); font-weight: normal; margin-left: 6px; }
  .cellmeta { font-size: 11px; color: var(--muted); margin-bottom: 10px;
              overflow-wrap: break-word; }
  .grid-outer { position: relative; width: 352px; height: 352px; }
  .grid { position: absolute; inset: 0; display: grid;
          grid-template-columns: repeat(16, 22px); grid-auto-rows: 22px; }
  .cell { width: 22px; height: 22px; background: var(--cell-off); border: 0;
          padding: 0; cursor: pointer; }
  .grid.showgrid .cell { border-right: 1px solid var(--grid-line);
                         border-bottom: 1px solid var(--grid-line); }
  .cell.on { background: var(--ink); }
  .ghost { position: absolute; inset: 0; pointer-events: none; }
  .row2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 12px; padding: 7px 10px; cursor: pointer;
         border: 1px solid var(--grid-line); border-radius: 7px;
         background: var(--panel); color: var(--ink); }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .toggle input { accent-color: var(--accent); }
  .prev-card { flex: 1 1 320px; min-width: 300px; --pvpx: 48px; }
  .prevgrid { display: grid; gap: 6px; max-height: 560px; overflow-y: auto;
              grid-template-columns: repeat(auto-fill, calc(var(--pvpx) + 8px)); }
  .pv { border: 1px solid var(--faint); border-radius: 6px; padding: 3px;
        background: var(--cell-off); text-align: center; cursor: pointer; }
  .pv:hover { border-color: var(--accent, #888); }
  .pv canvas { display: block; width: var(--pvpx); height: var(--pvpx);
               image-rendering: pixelated; }
  .pv .lbl { font-size: 9px; color: var(--muted); margin-top: 1px; }
  .pv.confirmed { border-color: var(--confirm); }
  .pv.blocked { opacity: 0.4; border-style: dashed; }
  .swatches { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .sw { border: 1px solid var(--faint); border-radius: 5px; background: var(--cell-off);
        padding: 2px; cursor: pointer; }
  .sw canvas { display: block; width: 28px; height: 28px; image-rendering: pixelated; }
  .sw[aria-selected="true"] { border-color: var(--ref2); box-shadow: 0 0 0 2px var(--accent-soft); }
  .toasts { position: fixed; bottom: 16px; right: 16px; display: flex;
            flex-direction: column; gap: 8px; z-index: 20; }
  .toast { font-size: 13px; padding: 9px 14px; border-radius: 9px; background: var(--ink);
           color: var(--panel); opacity: 0; transform: translateY(6px); transition: all .2s; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast[data-kind="error"] { background: var(--warn); color: #fff; }
</style>

<div class="wrap">
  <h1>부품 셀 에디터</h1>
  <p class="sub">11,172자 확장용. 셀을 고르고 <b>대표 음절</b>을 그려 저장하면
    <code>tools/glyphs_light.json</code>에 확정본으로 들어가고, 부품은 거기서 자동 추출됩니다.
    자세한 건 <code>docs/ROADMAP.md</code>.</p>

  <div class="layout">
    <div class="card list-card">
      <div class="row2" style="margin: 0 0 8px">
        <label class="toggle"><input type="checkbox" id="fTodo"> 그릴 셀만</label>
      </div>
      <div class="rows">
        <table>
          <thead><tr><th>셀</th><th>벌</th><th>상태</th><th>영향</th><th>제안</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card draw-card">
      <div class="cellname">
        <span id="cellName">셀을 고르세요</span>
        <span class="cp" id="cpLabel"></span>
      </div>
      <div class="cellmeta" id="cellMeta">—</div>
      <div class="grid-outer">
        <div class="grid showgrid" id="grid"></div>
        <canvas class="ghost" id="ghostBold" width="352" height="352"></canvas>
        <canvas class="ghost" id="ghostChar" width="352" height="352"></canvas>
      </div>
      <div class="row2">
        <label class="toggle"><input type="checkbox" id="tBold" checked> 원본 뼈대(파랑)</label>
      </div>
      <div class="row2">
        <label class="toggle"><input type="checkbox" id="tChar" checked> 참고(초록)</label>
        <input id="refChar" maxlength="2" autocomplete="off"
               style="font: inherit; font-size: 14px; width: 46px; text-align: center;
                      border: 1px solid var(--grid-line); border-radius: 6px;
                      background: var(--ground); color: var(--ink); padding: 4px;">
        <span id="refState" style="font-size: 11px; color: var(--muted)"></span>
      </div>
      <div class="swatches" id="swatches"></div>
      <div class="row2">
        <button class="btn" data-act="clear">비우기</button>
        <button class="btn" data-act="up">↑</button>
        <button class="btn" data-act="down">↓</button>
        <button class="btn" data-act="left">←</button>
        <button class="btn" data-act="right">→</button>
        <button class="btn" data-act="revert">원래대로</button>
      </div>
      <div class="row2">
        <button class="btn primary" id="save">저장</button>
        <span class="sub" id="status" style="margin:0"></span>
      </div>
    </div>

    <div class="card prev-card">
      <div class="row2" style="margin: 0 0 2px; justify-content: space-between">
        <span class="cellname">미리보기</span>
        <span class="tabbar" style="margin: 0" role="group" aria-label="배율">
          <button class="tab" data-scale="2" role="button" aria-selected="false">2×</button>
          <button class="tab" data-scale="3" role="button" aria-selected="true">3×</button>
        </span>
      </div>
      <div class="cellmeta" id="prevMeta">이 부품을 쓰는 음절들</div>
      <div class="prevgrid" id="prevGrid"></div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
  const W = 16, H = 16, PX = 22;
  const gridEl = document.getElementById("grid");
  const rowsEl = document.getElementById("rows");
  const toastsEl = document.getElementById("toasts");

  let CELLS = [];
  let todoOnly = false;    // 그릴 셀만 보기
  let cur = null;          // selected cell record
  let curChar = null;      // representative syllable being drawn
  let cells = blank();
  let boldOn = true, charOn = true;
  let boldRows = null, charRows = null;

  function blank() { return Array.from({length: H}, () => Array(W).fill(false)); }
  function toCells(rows) {
    return rows.map(r => Array.from({length: W}, (_, x) => r[x] === "#"));
  }
  function toRows() {
    return cells.map(r => r.map(v => v ? "#" : ".").join(""));
  }

  function showToast(msg, kind) {
    const el = document.createElement("div");
    el.className = "toast"; el.dataset.kind = kind || "info"; el.textContent = msg;
    toastsEl.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); },
               kind === "error" ? 4000 : 2000);
  }

  // ---- grid ----
  function buildGrid() {
    gridEl.innerHTML = "";
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = document.createElement("button");
      b.className = "cell"; b.dataset.x = x; b.dataset.y = y;
      gridEl.appendChild(b);
    }
    paintAll(); drawGhosts();
  }
  function paintAll() {
    const n = gridEl.children;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      n[y*W+x].classList.toggle("on", !!cells[y][x]);
  }
  let painting = false, val = true;
  gridEl.addEventListener("pointerdown", e => {
    const t = e.target.closest(".cell"); if (!t) return;
    painting = true;
    const x = +t.dataset.x, y = +t.dataset.y;
    val = !cells[y][x]; cells[y][x] = val;
    t.classList.toggle("on", val); e.preventDefault();
  });
  gridEl.addEventListener("pointerover", e => {
    if (!painting) return;
    const t = e.target.closest(".cell"); if (!t) return;
    const x = +t.dataset.x, y = +t.dataset.y;
    cells[y][x] = val; t.classList.toggle("on", val);
  });
  window.addEventListener("pointerup", () => {
    if (painting) { painting = false; schedulePreview(); }
  });

  // ---- preview: what this component does to the syllables built from it ----
  document.querySelectorAll("[data-scale]").forEach(b =>
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-scale]").forEach(x =>
        x.setAttribute("aria-selected", x === b ? "true" : "false"));
      document.querySelector(".prev-card").style.setProperty(
        "--pvpx", (16 * +b.dataset.scale) + "px");
    }));
  let prevTimer = null;
  function schedulePreview() {
    clearTimeout(prevTimer);
    prevTimer = setTimeout(renderPreview, 350);   // recompose costs ~0.45s
  }
  async function renderPreview() {
    const el = document.getElementById("prevGrid");
    const meta = document.getElementById("prevMeta");
    if (!curChar) { el.innerHTML = ""; meta.textContent = "셀을 고르세요"; return; }
    meta.textContent = "계산 중…";
    let out;
    try {
      const res = await fetch("api/cell_preview", {
        method: "POST", headers: {"Content-Type": "application/json"},
        // scope to the selected cell, or the anchor's OTHER cell drags in
        // syllables that don't use this component at all
        body: JSON.stringify({ch: curChar, rows: toRows(),
                              cell: cur && cur.id}),
      });
      out = (await res.json()).chars || [];
    } catch (err) { meta.textContent = "미리보기 실패"; return; }
    el.innerHTML = "";
    let composed = 0;
    for (const c of out) {
      const d = document.createElement("div");
      d.className = "pv" + (c.confirmed ? " confirmed" : "") + (c.rows ? "" : " blocked");
      d.title = c.rows ? (c.confirmed ? `${c.ch} (확정본)` : `${c.ch} (조합)`)
                       : `${c.ch} — 다른 셀이 아직 비어 조합 불가. 눌러서 직접 그리면 채워집니다.`;
      const cv = document.createElement("canvas");
      cv.width = 16; cv.height = 16;
      if (c.rows) {
        composed++;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink");
        for (let y = 0; y < 16; y++)
          for (let x = 0; x < c.rows[y].length; x++)
            if (c.rows[y][x] === "#") ctx.fillRect(x, y, 1, 1);
      }
      const lbl = document.createElement("div");
      lbl.className = "lbl"; lbl.textContent = c.ch;
      d.appendChild(cv); d.appendChild(lbl); el.appendChild(d);
      // palette: click any affected syllable to load and fix it directly,
      // instead of only ever being able to draw the cell's own `suggest`
      // (which can't touch an already-resolved cell at all -- see 맋/jong:ㄳ).
      // Uncomposable ones are clickable too and matter MOST -- drawing one is
      // exactly what fills the empty cell blocking it. It just opens blank,
      // with the Bold skeleton underneath, since there is nothing to seed from.
      d.addEventListener("click", () => loadChar(c.ch, c.rows));
    }
    meta.textContent = `이 부품을 쓰는 음절 ${out.length}개 · 조합됨 ${composed}`;
  }

  function paintGhost(cv, rows, color) {
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!rows) return;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(color);
    ctx.globalAlpha = 0.45;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (rows[y] && rows[y][x] === "#") ctx.fillRect(x*PX, y*PX, PX, PX);
    ctx.globalAlpha = 1;
  }
  function drawGhosts() {
    paintGhost(document.getElementById("ghostBold"), boldOn ? boldRows : null, "--ref");
    paintGhost(document.getElementById("ghostChar"), charOn ? charRows : null, "--ref3");
  }
  document.getElementById("tBold").addEventListener("change", e => {
    boldOn = e.target.checked; drawGhosts();
  });
  document.getElementById("tChar").addEventListener("change", e => {
    charOn = e.target.checked; drawGhosts();
  });

  // 참고: a syllable typed here shows in green, for tracing a similar shape
  // that is already drawn. CONFIRMED glyphs only -- /api/text would happily
  // answer with the original strike auto-thinned for anything outside the
  // 2,350, and tracing that would mean copying an unreviewed guess while it
  // looks exactly like real work. Read the confirmed file instead and show
  // nothing when the character isn't in it.
  const refState = document.getElementById("refState");
  document.getElementById("refChar").addEventListener("input", async e => {
    const ch = Array.from(e.target.value)[0] || "";
    e.target.value = ch;
    charRows = null;
    if (!ch) { refState.textContent = ""; drawGhosts(); return; }
    try {
      const all = await (await fetch("api/glyphs?weight=light",
                                     {cache: "no-store"})).json();
      charRows = all[ch] || null;
    } catch (err) { charRows = null; }
    refState.textContent = charRows ? "확정본" : "확정본 없음";
    refState.style.color = charRows
      ? "var(--confirm)" : "var(--muted)";
    drawGhosts();
  });

  // ---- tools ----
  function shift(dx, dy) {
    const out = blank();
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ny = y+dy, nx = x+dx;
      if (ny >= 0 && ny < H && nx >= 0 && nx < W) out[ny][nx] = cells[y][x];
    }
    return out;
  }
  document.querySelectorAll("[data-act]").forEach(b =>
    b.addEventListener("click", () => {
      const a = b.dataset.act;
      if (a === "clear") cells = blank();
      else if (a === "up") cells = shift(0, -1);
      else if (a === "down") cells = shift(0, 1);
      else if (a === "left") cells = shift(-1, 0);
      else if (a === "right") cells = shift(1, 0);
      else if (a === "revert") { loadChar(curChar); return; }
      paintAll(); schedulePreview();
    }));

  // ---- list ----
  function status(c) {
    // No "저신뢰" tier: sample disagreement turned out to measure extraction
    // mechanics, not glyph quality. Of 184 flagged cells, 49% had source
    // glyphs that were pixel-identical where the extracts disagreed (the 받침
    // zone just caught different pixels), 19% were subtraction-path artifacts,
    // and the rest differed by 1-3px -- deliberate optical corrections, not
    // errors. Nothing actionable was left, so the tier is gone.
    return c.samples === 0 ? ["empty", "그릴 것"] : ["ok", "확정"];
  }
  // 가나다순: 초중성 먼저, 그 안에서 자모순. Plain codepoint order on the
  // compatibility-jamo block already IS the standard order -- 초성/중성 never
  // include clusters, and for 종성 the block interleaves them exactly where
  // 가나다 wants them (ㄱㄲㄳㄴㄵㄶㄷㄹㄺ...). No collation table needed.
  const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  function renderList() {
    const shown = CELLS.filter(c => !todoOnly || c.samples === 0)
                       .sort((a, b) => cmp(a.kind, b.kind)
                                    || cmp(a.jamo, b.jamo)
                                    || cmp(a.beol, b.beol));
    rowsEl.innerHTML = "";
    for (const c of shown) {          // no cap -- the list is the review queue
      const [k, label] = status(c);
      const tr = document.createElement("tr");
      tr.className = "row"; tr.dataset.id = c.id;
      tr.setAttribute("aria-selected", cur && cur.id === c.id ? "true" : "false");
      tr.innerHTML =
        `<td><span class="jamo">${c.jamo}</span> <span class="pill">${c.kind}</span></td>` +
        `<td>${c.beol}</td>` +
        `<td><span class="pill ${k}">${label}</span>` +
        (c.samples ? ` <span class="pill">샘플 ${c.samples}</span>` : "") +
        `</td><td>${c.affects}</td>` +
        `<td class="jamo">${c.suggest || "—"}` +
        (c.suggest && !c.resolvable
          ? ` <span class="pill warn" title="다른 셀이 먼저 안 풀려서, 이 글자만 그리면 이 셀도 계속 빈 채로 남습니다.">순서 필요</span>`
          : "") +
        `</td>`;
      tr.addEventListener("click", () => selectCell(c));
      rowsEl.appendChild(tr);
    }
    const todo = CELLS.filter(c => c.samples === 0).length;
    document.getElementById("status").textContent =
      `${shown.length}셀` + (todoOnly || !todo ? "" : ` · 그릴 것 ${todo}`);
  }
  document.getElementById("fTodo").addEventListener("change", e => {
    todoOnly = e.target.checked;
    renderList();
  });

  // ---- select / load ----
  function setCpLabel(ch) {
    document.getElementById("cpLabel").textContent = ch
      ? "U+" + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0") : "";
  }
  async function selectCell(c) {
    cur = c;
    document.getElementById("cellName").textContent = c.id;
    setCpLabel(null);
    document.getElementById("cellMeta").textContent =
      `${c.kind === "LV" ? "초중성" : "종성"} ${c.jamo} · 벌 ${c.beol} · ` +
      `영향 음절 ${c.affects} · 샘플 ${c.samples}` +
      (c.suggest && !c.resolvable
        ? "  ⚠ 다른 셀이 아직 안 풀려서 이 글자만 그려선 안 풀립니다 — 그려두면 나중에 그 셀이 풀릴 때 자동으로 같이 풀립니다."
        : "");
    renderList();
    renderSwatches(c);
    // A filled cell has no suggestion (nothing new to draw would change it),
    // so open one of its own confirmed syllables -- that both fills the canvas
    // and anchors the preview palette on this cell instead of the previous one.
    await loadChar(c.suggest || (c.examples || [])[0]);
  }
  function renderSwatches(c) {
    const el = document.getElementById("swatches");
    el.innerHTML = "";
    for (const ch of c.examples || []) {
      const b = document.createElement("button");
      b.className = "sw"; b.title = `${ch} (확정본)`;
      const cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      b.appendChild(cv); el.appendChild(b);
      fetch("api/text?weight=light&s=" + encodeURIComponent(ch), {cache: "no-store"})
        .then(r => r.json()).then(j => {
          const rows = j.chars && j.chars[0] && j.chars[0].rows;
          if (!rows) return;
          const ctx = cv.getContext("2d");
          ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink");
          for (let y = 0; y < H; y++) for (let x = 0; x < rows[y].length; x++)
            if (rows[y][x] === "#") ctx.fillRect(x, y, 1, 1);
        });
    }
  }
  async function loadChar(ch, seedRows) {
    curChar = ch;
    if (!ch) { cells = blank(); boldRows = null; setCpLabel(null); buildGrid(); return; }
    document.getElementById("cellName").textContent = `${cur.id}   ← ${ch}`;
    setCpLabel(ch);
    // existing confirmed glyph for this syllable, if any. seedRows is the
    // composed result for an unconfirmed one clicked in the preview -- start
    // from what's actually wrong rather than from an empty canvas.
    const j = await (await fetch("api/glyphs?weight=light", {cache: "no-store"})).json();
    cells = j[ch] ? toCells(j[ch]) : (seedRows ? toCells(seedRows) : blank());
    // Bold on purpose, unthinned: it shows the original skeleton as drawn, and
    // deciding which stroke survives the 1px reduction is a visual call to make
    // against it, not something to pre-apply.
    const b = await (await fetch("api/text?weight=regular&s=" + encodeURIComponent(ch),
                                 {cache: "no-store"})).json();
    boldRows = b.chars && b.chars[0] && b.chars[0].rows;
    buildGrid();
    renderPreview();
  }

  document.getElementById("save").addEventListener("click", async e => {
    if (!curChar) { showToast("셀을 먼저 고르세요", "error"); return; }
    const btn = e.currentTarget; btn.disabled = true;
    try {
      const body = {}; body[curChar] = toRows();
      const res = await fetch("api/glyphs?weight=light", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(await res.text());
      showToast(`저장됨 · ${curChar}`, "success");
      await refresh();                    // cell status recomputes from the corpus
      const again = CELLS.find(c => c.id === cur.id);
      if (again) { cur = again; renderList(); }
    } catch (err) {
      showToast(String(err.message || err), "error");
    } finally { btn.disabled = false; }
  });

  async function refresh() {
    const j = await (await fetch("api/cells", {cache: "no-store"})).json();
    CELLS = j.cells || [];
    renderList();
  }
  refresh();
</script>
