<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도깨비DNR 고딕</title>
<link rel="stylesheet" href="editor.css">
<script src="preview_presets.js"></script>
<style>
  /* This file IS both pages: the public specimen (GitHub Pages -- the
     .github/workflows/webfont.yml deploy copies it into _site/ with
     editor.css, preview_presets.js and the woff2s) and the editor's own
     /preview (scripts/editor_server.py serves this same file and injects
     tools/preview_local.js before </body>, which adds a second render box
     drawing the CURRENT SAVED glyphs -- pre-build data the webfont can't
     show yet). There is no other preview page.

     Contract with preview_local.js: the element ids tester / presets /
     weightSeg / sizeRange / status and the PRESETS global stay stable --
     that script hooks them by name and adds nothing else to this file.

     CSS here is page-specific only; shared tokens/.app/.topbar/.card/.btn/
     .status live in editor.css (the same file every editor page links). */
  @font-face {
    font-family: "Dokkaebi DNR Gothic";
    src: url("DokkaebiDNRGothic-Regular.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Dokkaebi DNR Gothic";
    src: url("DokkaebiDNRGothic-Bold.woff2") format("woff2");
    font-weight: 700;
  }

  .seg { display: inline-flex; border: 1px solid var(--grid-line); border-radius: 8px;
         overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted);
                font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--grid-line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  textarea { width: 100%; min-height: 220px; resize: vertical; font: inherit;
             padding: 10px 12px; border: 1px solid var(--grid-line);
             border-radius: 8px; background: var(--panel); color: var(--ink);
             font-family: "Dokkaebi DNR Gothic", monospace; line-height: 1.6; }

  .scale-row { display: flex; align-items: center; gap: 8px; margin-top: 10px;
               font-size: 12px; color: var(--muted); }
  .scale-row input[type="range"] { width: 160px; }

  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }
  code { font-family: var(--mono); color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>도깨비DNR 고딕 / Dokkaebi DNR Gothic</h1>
    <div class="seg" id="weightSeg" role="tablist" aria-label="굵기">
      <button type="button" data-weight="400" aria-pressed="true">Regular</button>
      <button type="button" data-weight="700" aria-pressed="false">Bold</button>
    </div>
    <span class="status" id="status">불러오는 중…</span>
  </header>

  <div class="card">
    <div class="seg" id="presets" style="margin-bottom: 10px;">
      <button type="button" data-preset="body">본문</button>
      <button type="button" data-preset="en">영문</button>
      <button type="button" data-preset="game">게임 UI</button>
      <button type="button" data-preset="symbols">기호</button>
      <button type="button" data-preset="jamo">자모</button>
    </div>
    <textarea id="tester" spellcheck="false"></textarea>
    <div class="scale-row">
      <label for="sizeRange">크기</label>
      <input type="range" id="sizeRange" min="12" max="96" step="1" value="32">
      <span id="sizeLabel">32px</span>
    </div>
    <p class="hint">위 칸에 직접 타이핑해서 확인하세요. 굵기·크기는 위 컨트롤로 바꿉니다.</p>
  </div>

  <div class="card" style="margin-top: 16px;">
    <p class="hint" style="margin-top: 0;">
      <code>@font-face { src: url("DokkaebiDNRGothic-Regular.woff2") format("woff2"); }</code>
    </p>
    <p class="hint">
      더 큰 웨이트/포맷과 업데이트 확인은
      <a href="https://github.com/flvrdoyster/font" style="color: var(--accent);">GitHub 저장소</a>를 참고하세요.
    </p>
  </div>
</div>

<script>
  const textarea = document.getElementById("tester");
  const sizeRange = document.getElementById("sizeRange");
  const sizeLabel = document.getElementById("sizeLabel");
  const weightSeg = document.getElementById("weightSeg");
  const presetsEl = document.getElementById("presets");
  const statusEl = document.getElementById("status");

  // 프리셋 텍스트는 preview_presets.js 하나뿐 -- 여긴 그 객체를 그대로 쓴다.
  // 로컬(/preview)에서는 preview_local.js가 검수(내부 QA 전용) 프리셋을 여기에
  // 얹는다 -- 그래서 const지만 객체 내용은 그 스크립트가 건드릴 수 있어야 한다.
  const PRESETS = PREVIEW_PRESETS;

  function applySize(px) {
    textarea.style.fontSize = px + "px";
    sizeLabel.textContent = px + "px";
  }
  function applyWeight(w) {
    textarea.style.fontWeight = w;
    for (const btn of weightSeg.querySelectorAll("button"))
      btn.setAttribute("aria-pressed", btn.dataset.weight === String(w));
  }

  sizeRange.addEventListener("input", () => applySize(sizeRange.value));
  weightSeg.addEventListener("click", e => {
    const btn = e.target.closest("button[data-weight]");
    if (btn) applyWeight(btn.dataset.weight);
  });
  presetsEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-preset]");
    if (btn) textarea.value = PRESETS[btn.dataset.preset];
  });

  applySize(sizeRange.value);
  applyWeight(400);
  textarea.value = PRESETS.body;

  Promise.all([
    document.fonts.load('16px "Dokkaebi DNR Gothic"'),
    document.fonts.load('700 16px "Dokkaebi DNR Gothic"'),
  ]).then(() => {
    statusEl.textContent = "준비됨";
    statusEl.dataset.on = "true";
  }).catch(() => {
    statusEl.textContent = "불러오기 실패";
  });
</script>
</body>
</html>
